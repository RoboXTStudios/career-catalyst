  technical: Python is Working Knowledge; do not portray the candidate as a software, backend, data, or machine-learning engineer.
  roboxt: Do not claim paid clients, agency services, revenue, commercial scale, external staff, or a managed creator roster.
  music_industry: Do not infer A&R, artist management, label operations, talent buying, booking, tour management, contract negotiation, or artist-relations ownership.
  sales_revenue: Do not infer revenue operations, territory planning, sales forecasting, pipeline ownership, quota management, or CRM administration.
  age_signaling: Prefer capability, progression, scope, and impact over age-signaling tenure language.
