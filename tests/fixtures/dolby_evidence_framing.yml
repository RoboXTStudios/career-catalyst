evidence:
- id: campaign_operations_leadership
  framing:
    program_manager: Owned the Disney+ advertising rebuild as a defined program, coordinating
      creative, media, analytics, technology, and operations teams against specific
      delivery milestones after the business moved back from a competing agency, growing
      managed budgets from $5M to $25M+ per title.
    operations_manager: Led enterprise campaign operations supporting Disney Studios
      Theatrical and Disney Streaming/DSS on an ongoing basis, building and running
      the operating structure that coordinated creative, media, analytics, technology,
      and operations teams across the full slate.
- id: launch_readiness
  framing:
    program_manager: Ran launch readiness as a milestone-driven program for the Disney+
      launch and relaunch, using checklists, validation gates, and escalation procedures
      scoped to specific launch dates and deliverables.
    operations_manager: Built and operated the standing launch-readiness function,
      including checklists, validation processes, and escalation procedures used across
      every Disney Studios and Disney+ campaign on an ongoing basis.
- id: workflow_design
  framing:
    program_manager: Delivered a defined initiative migrating Disney's campaign tracking
      from spreadsheets to a shared Airtable system, managing the rollout end-to-end
      and onboarding agency and client teams onto the new workflow.
    operations_manager: Designed and maintained the scalable workflows, governance,
      and handoff standards underpinning day-to-day campaign operations, including
      migrating the team from spreadsheet-based tracking to a shared Airtable system.
