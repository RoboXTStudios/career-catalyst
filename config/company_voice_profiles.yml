company_voice_profiles:
  disney:
    companies:
      - "Disney"
      - "Disney Entertainment"
      - "The Walt Disney Company"
    tone:
      - polished
      - strategic
      - product-and-technology-aware
      - enterprise entertainment
    cover_letter_angle:
      - "connect Disney ecosystem familiarity with product, technology, operating rhythms, and large-scale creative execution"
      - "emphasize Disney Studios Theatrical, Disney Streaming/DSS, theatrical and streaming film campaign operations, franchise/IP, and executive operating systems"
    avoid:
      - "sounding like a former agency vendor asking to come back"
      - "overusing nostalgia"
      - "overexplaining Disney business units"

  google_youtube:
    companies:
      - "Google"
      - "YouTube"
    tone:
      - precise
      - product-aware
      - strategic
      - operational
      - data-fluent
    cover_letter_angle:
      - "connect long-term hands-on Google advertising product familiarity with YouTube product activation, GTM operations, seller enablement, and large advertiser execution"
      - "show ability to bridge brand objectives, product priorities, campaign activation, and operational clarity"
    avoid:
      - "implying Trisha worked at Google"
      - "mentioning family connections"
      - "sounding like old-school ad trafficking"

  paramount:
    companies:
      - "Paramount"
    tone:
      - creative-operations-focused
      - clear
      - practical
      - entertainment-marketing-aware
    cover_letter_angle:
      - "emphasize marketing operations as the connective layer between strategy and creative production"
      - "highlight workflow systems, AI enablement, dashboards, creative capacity, resource management, and high-volume entertainment campaign execution"
    avoid:
      - "over-indexing on ad operations"
      - "sounding too abstract or consultant-like"

  uta:
    companies:
      - "UTA"
      - "United Talent Agency"
    tone:
      - advisory
      - sharp
      - strategic
      - media-and-marketing-fluent
    cover_letter_angle:
      - "position Trisha as an operator who understands media, marketing, advertising, and technology ecosystems from the inside"
      - "emphasize transformation, operating models, client-facing recommendations, stakeholder management, and strategy into execution"
    avoid:
      - "sounding like a pure internal operations candidate"
      - "overemphasizing Disney specifics"
      - "underselling client-facing communication"

  fieldai:
    companies:
      - "FieldAI"
      - "Field AI"
    tone:
      - systems-minded
      - operational
      - startup-aware
      - AI-forward
    cover_letter_angle:
      - "emphasize matrix operations, organizational efficiency, capacity planning, operating cadences, automation, dashboards, and AI workflow systems"
      - "connect Career Catalyst and CampaignOS-style thinking to organizational clarity and execution"
    avoid:
      - "making entertainment the center of the story"
      - "sounding too corporate for an AI startup"

  bandsintown:
    companies:
      - "Bandsintown"
      - "BandsInTown"
      - "Bandsintown for Artists"
    tone:
      - music-aware
      - editorial
      - creative
      - human
      - community-minded
      - still professional
    cover_letter_angle:
      - "connect Trisha's music background, editorial voice, fan/community understanding, Substack writing, Multiverse editorial leadership, and marketing operations experience"
      - "show that she understands artists, fans, live discovery, music culture, and content strategy"
      - "balance creative storytelling with operational discipline"
    avoid:
      - "sounding like a generic marketing operations letter"
      - "overusing corporate strategy language"
      - "trying too hard to prove music credibility"
      - "sounding like fan mail"

  crunchyroll:
    companies:
      - "Crunchyroll"
    tone:
      - fandom-aware
      - strategic
      - streaming-aware
      - operational
    cover_letter_angle:
      - "connect entertainment operations, streaming, fandom, franchise/IP, and enterprise strategy"
      - "emphasize ability to turn complex cross-functional priorities into execution systems"
    avoid:
      - "sounding too formal or detached from fandom"
      - "overusing anime references unless grounded"
