evidence_cards:
  - id: omg23_disney_leadership
    label: OMG23 / Disney entertainment leadership
    short_description: Large-scale entertainment campaign operations leadership across Disney theatrical and streaming work.
    proof_points:
      - Advanced from Campaign Manager to Group Director while leading Disney Studios Theatrical and Disney Streaming/DSS campaign operations.
      - Led 10 direct reports and provided strategic and operational leadership across an integrated 64-person organization spanning Ad Operations, Creative Management, and Marketing Science and Analytics.
    tags: [entertainment_marketing_operations, creative_operations, operations_leadership, executive_communication]
    strongest_role_fits: [entertainment marketing operations, creative operations, media operations]
    when_to_use: Use when a role needs entertainment marketing, campaign operations, stakeholder coordination, or senior delivery leadership.
    when_to_avoid: Avoid as the lead proof point for roles that are primarily founder, editorial, or unrelated to marketing operations.
    confidence_level: high
    source: data/achievements.yml:omg23_advancement,cross_functional_leadership
  - id: campaignos
    label: CampaignOS
    short_description: Working prototype for AI-powered campaign operations focused on workflow governance, QA, validation, and reporting.
    proof_points:
      - Built and iterated CampaignOS as a working prototype using schema-driven workflows, validation frameworks, and operational reporting.
      - Built from recurring enterprise entertainment operations problems and retained as a working prototype pending representative campaign data and practical testing.
    tags: [ai_workflows, product_thinking, martech, governance, qa, builder]
    strongest_role_fits: [builder role, martech operations, product operations, AI operations]
    when_to_use: Use when AI workflows, automation, workflow systems, product thinking, martech, or builder orientation are directly relevant.
    when_to_avoid: Do not include by default for traditional PMO or generic operations roles unless the job clearly asks for automation, systems, or product thinking.
    career_priority: supporting
    confidence_level: high
    source: data/projects.yml:CampaignOS;data/achievements.yml:campaignos_ai_operations
  - id: career_catalyst
    label: Career Catalyst
    short_description: Active career-intelligence product demonstrating product ownership, practical AI workflow design, evidence provenance, role intelligence, document automation, quality gates, and production hardening.
    proof_points:
      - Built and iterates a role-aware system for parsing opportunities, scoring fit, selecting grounded Evidence, and generating ATS-safe application materials.
      - Defined requirements and implemented human-in-the-loop workflows for provenance, transactional generation, recovery controls, regression testing, voice calibration, and document quality assurance.
    tags: [builder, ai_workflows, product_thinking, career_strategy, human_in_the_loop, product_ownership, quality_assurance]
    strongest_role_fits: [human agency builder role, AI workflow role, product operations, product management, technical program management, transformation]
    when_to_use: Use as the primary current product-building proof for builder-friendly, human agency, AI workflow, transformation, technical-program, or product-minded roles.
    when_to_avoid: Avoid for traditional PMO, governance-only, or conservative enterprise roles unless tooling/building is requested.
    confidence_level: high
    career_priority: primary_current_builder
    source: data/projects.yml:Career Catalyst
  - id: roboxt_studios
    label: RoboXT Studios
    short_description: Launched public creative platform and current independent media-production practice spanning photography, videography, music and concert media, editorial work, content operations, digital publishing, and brand development.
    proof_points:
      - Demonstrates media production, creative direction, photography, videography, editorial development, WordPress publishing, content packaging, and post-production workflow ownership.
    tags: [builder, creative_work, entrepreneurship, media_production, music, content_operations, digital_publishing]
    strongest_role_fits: [media production, music and entertainment, creative operations, content operations, digital publishing]
    when_to_use: Use for entrepreneurial, entertainment, music, media, creator, production, content-operations, or creative-technology roles.
    when_to_avoid: Avoid for traditional PMO, governance, entertainment marketing operations, or conservative enterprise roles.
    confidence_level: high
    career_priority: primary_current_media
    source: data/projects.yml:RoboXT Studios
  - id: github_product_delivery
    label: GitHub product delivery
    short_description: Public repository evidence for Career Catalyst requirements, iteration, testing, and production-hardening work.
    proof_points:
      - The public Career Catalyst repository shows iterative product delivery, regression protection, structured-data design, and workflow hardening.
    tags: [github, product_delivery, ai_workflows, testing, requirements, builder]
    strongest_role_fits: [AI workflow role, product operations, product management, technical program management, transformation]
    when_to_use: Use when a public build record materially strengthens product, systems, transformation, or technical-program credibility.
    when_to_avoid: Avoid adding GitHub to materials for roles where it distracts from stronger senior enterprise evidence.
    confidence_level: high
    career_priority: supporting
    source: data/projects.yml:Career Catalyst
  - id: governance_qa_delivery
    label: Governance, QA, and delivery leadership
    short_description: Practical operating discipline across workflows, quality standards, risk visibility, and dependable delivery.
    proof_points:
      - Introduced scalable workflows, governance practices, and execution standards across marketing, technology, analytics, and creative teams.
      - Connected quality assurance, measurement readiness, and partner coordination in campaign delivery.
    tags: [governance, qa, pmo, operations_leadership, executive_communication]
    strongest_role_fits: [traditional PMO, governance, delivery leadership, operations]
    when_to_use: Use for PMO, governance, delivery, process excellence, QA, or executive visibility roles.
    when_to_avoid: Avoid making it sound more technical or quantified than the stored evidence supports.
    confidence_level: high
    source: data/achievements.yml:workflow_governance,disney_plus_launch_support
  - id: martech_campaign_execution
    label: Martech and campaign execution
    short_description: Campaign, platform, measurement, and operational workflows across entertainment advertisers.
    proof_points:
      - Translated Google and YouTube platform capabilities into campaign execution, measurement readiness, and operational workflows.
      - Connected brand objectives, platform activation, analytics, technology, and delivery across large entertainment advertisers.
    tags: [martech, adtech, campaign_execution, measurement, entertainment_marketing_operations]
    strongest_role_fits: [martech operations, CRM operations, adtech operations, GTM activation]
    when_to_use: Use for martech, CRM, lifecycle, adtech, platform activation, or measurement-readiness roles.
    when_to_avoid: Avoid implying formal Google employment or unsupported platform partnership.
    confidence_level: high
    source: data/achievements.yml:google_youtube_platform_familiarity
  - id: photography_creative_voice
    label: Photography and creative voice
    short_description: Creative practice and visual/editorial judgment that can support audience, content, or creative operations narratives.
    proof_points:
      - Demonstrates creative judgment and human voice when the role explicitly values content, photography, storytelling, or creative practice.
    tags: [photography, creative_work, storytelling, editorial]
    strongest_role_fits: [creative operations, content strategy, community role]
    when_to_use: Use only when the role explicitly values creative practice, visual storytelling, or editorial voice.
    when_to_avoid: Avoid for PMO, governance, martech, or entertainment operations roles where it distracts from role evidence.
    confidence_level: medium
    source: personal creative practice
