    summary: "Advanced through five roles from hands-on campaign execution into enterprise operations and transformation leadership across Ad Operations, Creative Management, Marketing Science, Analytics, and broader marketing operations."
    highlights:
      - "Advanced through five roles from hands-on campaign execution into enterprise operations and transformation leadership across Ad Operations, Creative Management, Marketing Science, Analytics, and broader marketing operations."
      - "Led 10 direct reports spanning directors, associate directors, senior campaign managers, and project managers across Ad Operations, Creative Management, and Marketing Science and Analytics."
      - "Provided strategic and operational leadership across an integrated 64-person organization comprising approximately 24 Ad Operations, 26 Creative Management, and 14 Marketing Science and Analytics professionals."
      - "Supported Disney Studios, Disney+, Searchlight Pictures, Corporate Brand Management, and related theatrical, streaming, and franchise priorities."
      - "Directed operational execution and governance across hundreds to thousands of campaigns representing multimillion-dollar media investments."
      - "Served as the senior Ad Operations representative on the cross-functional task force responsible for operationalizing the Disney+ launch."
      - "Partnered directly with Disney Technology and Disney Streaming Services to establish governance, campaign taxonomies, pixel implementation, tracking structures, measurement readiness, and launch support within the required timeline."
      - "Designed and continuously improved campaign operating systems across CM360, DV360, Meta, TikTok, Innovid, DoubleVerify, IAS, TransUnion, LiveRamp, VideoAmp, Box, Airtable, Trello, and related platforms."
      - "Developed taxonomies, tagging structures, pixel frameworks, governance standards, quality controls, and documentation that improved consistency across teams, platforms, vendors, and client stakeholders."
      - "Materially influenced platform strategy, vendor evaluation, implementation planning, technical requirements, integrations, data flows, measurement design, troubleshooting, training, adoption, and organizational change."
      - "Created and implemented operational workflows with technology and measurement partners, including Innovid and TransUnion, that remained in use after implementation."
      - "Partnered across creative, marketing, media planning, analytics, engineering, technology, programmatic, search, social, vendors, and client leadership to resolve complex issues and deliver launches under aggressive deadlines."
      - "Created and served as Managing Editor of Multiverse, an internal editorial publication reaching more than 400 employees and highlighting creativity, innovation, culture, music, emerging media, and employee storytelling."
      - "Became a trusted escalation point for complex operational problems, with senior leaders relying on her to diagnose the issue, develop the solution, implement the strategy, and stabilize execution."
