- id: omg23_disney_leadership
  label: OMG23 / Disney entertainment leadership
  short_description: Large-scale entertainment campaign operations leadership across
    Disney theatrical and streaming work.
  proof_points:
  - Advanced from Campaign Manager to Group Director while leading Disney Studios
    Theatrical and Disney Streaming/DSS campaign operations.
  - Led 10 direct reports and provided strategic and operational leadership across
    an integrated 64-person organization spanning Ad Operations, Creative Management,
    and Marketing Science and Analytics.
  tags:
  - entertainment_marketing_operations
  - creative_operations
  - operations_leadership
  - executive_communication
  strongest_role_fits:
  - entertainment marketing operations
  - creative operations
  - media operations
  when_to_use: Use when a role needs entertainment marketing, campaign operations,
    stakeholder coordination, or senior delivery leadership.
  when_to_avoid: Avoid as the lead proof point for roles that are primarily founder,
    editorial, or unrelated to marketing operations.
  confidence_level: high
  source: data/achievements.yml:omg23_advancement,cross_functional_leadership
