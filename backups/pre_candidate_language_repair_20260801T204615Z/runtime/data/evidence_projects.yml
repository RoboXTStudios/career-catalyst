- title: Career Catalyst — AI-Enabled Career Intelligence & Application Operations Platform
  employer: RoboXT Studios
  client: Career Catalyst
  business_unit: Career Catalyst
  timeframe: June 2026 - Present
  industry: Career Technology / Software
  function: Product Management / Product Operations / AI Workflow Design
  project_type: AI-Enabled Product Development
  problem: Managing a senior-level job search required manually evaluating job postings, matching opportunities to verified experience, tailoring application materials, tracking statuses, and preparing follow-up and interview content across disconnected systems. Existing tools did not provide a reliable single source of truth or adequate safeguards against stale role context, unsupported claims, and inconsistent application materials.
  actions: Created and led development of Career Catalyst, an AI-enabled application and career-intelligence system. Defined the product vision, requirements, feature priorities, workflows, acceptance criteria, and release guardrails. Designed capabilities for prospect intake, match scoring, evidence selection, role-intent analysis, tailored résumé and cover-letter generation, follow-up planning, interview preparation, application tracking, and role archiving. Managed iterative development through GitHub, AI-assisted coding, focused regression testing, quality assurance, debugging, and production-data protections.
  results: Built and launched an actively used local application that centralizes prospect evaluation, verified career evidence, role-specific materials, follow-up planning, interview preparation, and application status management. Established deterministic role-context and candidate-claim safeguards to improve the accuracy and consistency of generated materials. Created a Git-ready development and release workflow with focused testing; the most recent major release passed 232 targeted regression tests.
  skills:
  - Product Strategy; Product Management; Product Operations; Requirements Definition; Roadmap Prioritization; User-Centered Workflow Design; AI Workflow Design; Prompt Engineering; Career Intelligence; Process Automation; Quality Assurance; Regression Testing; Data Governance; Change Management; Release Management
  technologies:
  - Python; Streamlit; Git; GitHub; YAML; Markdown; DOCX Automation; OpenAI Codex; AI-Assisted Development Tools
  tags:
  - AI Product; Career Technology; Workflow Automation; Product Operations; Candidate Experience; Human-in-the-Loop AI; LLM Applications; Personal Software
  links: []
