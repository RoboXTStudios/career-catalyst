  problem: Floodlight tracking information and technical reference materials were distributed across spreadsheets, emails, and individual team knowledge, making it difficult to maintain consistent records, understand the broader tag technology stack, and support reliable implementation and troubleshooting.
  actions: Designed and built a Microsoft Access database for centralized Floodlight tracking, using Microsoft Excel as the structured raw-data source. Organized tracking information into a repeatable system that supported visibility, continuity, and ongoing measurement operations. Also created a Disney Data Cheat Sheet mapping the tools and technologies used across the client’s tag stack and measurement environment.
